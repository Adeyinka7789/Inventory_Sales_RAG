# Streamlit theme for the Inventory & Sales policy assistant.
# Dual light/dark (the settings toggle stays available), Inter for text,
# JetBrains Mono for code, teal accent for the "policy/trust" feel.
# Docs: https://docs.streamlit.io/develop/api-reference/configuration/config.toml

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.8125rem"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["34px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
linkUnderline = true
paddingTop = "2.5rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F6"
codeBackgroundColor = "#F4F4F5"
codeTextColor = "#18181B"
textColor = "#09090B"
linkColor = "#0F766E"
borderColor = "#E4E4E7"
grayColor = "#71717A"
blueColor = "#2563EB"
greenColor = "#15803D"
redColor = "#DC2626"
yellowColor = "#CA8A04"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
chartCategoricalColors = ["#0F766E", "#2563EB", "#7C3AED", "#EA580C", "#CA8A04", "#DC2626", "#71717A"]
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#F4F4F5"

[theme.dark]
primaryColor = "#14B8A6"
backgroundColor = "#0B0B0D"
secondaryBackgroundColor = "#17171A"
codeBackgroundColor = "#1F1F23"
codeTextColor = "#E4E4E7"
textColor = "#FAFAFA"
linkColor = "#5EEAD4"
borderColor = "#2A2A2F"
grayColor = "#A1A1AA"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
redColor = "#F87171"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
chartCategoricalColors = ["#2DD4BF", "#60A5FA", "#A78BFA", "#FB923C", "#FACC15", "#F87171", "#A1A1AA"]
dataframeBorderColor = "#2A2A2F"
dataframeHeaderBackgroundColor = "#1F1F23"
dataframeHeaderTextColor = "#FAFAFA"

[theme.light.sidebar]
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#F4F4F5"
borderColor = "#E4E4E7"
textColor = "#09090B"
primaryColor = "#0F766E"
linkColor = "#0F766E"

[theme.dark.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#17171A"
borderColor = "#2A2A2F"
codeBackgroundColor = "#1F1F23"
textColor = "#FAFAFA"
primaryColor = "#14B8A6"
linkColor = "#5EEAD4"
